# port-manifest.toml: the upstream sync record for katago-rs.
#
# Upstream is KataGo, vendored as the git submodule `upstream/KataGo` (never edited).
# This file says, for every file under `upstream/KataGo/cpp/`, either which Rust (or
# tool) module ports it or why it is not ported. `cargo xtask upstream-diff --to <tag>`
# uses it to turn an upstream release into a list of modules (and, via the
# `/// upstream: Class::method (file.cpp)` tags, functions) to re-port.
#
# Paths in `upstream`, `secondary` and `paths` are relative to `upstream/KataGo` and start
# with `cpp/`. Rust paths are relative to the repo root.
#
# [[module]]  one per ported Rust module (one .rs per upstream .cpp/.h pair, at the
#             mirrored path; plan §1).
#   rust       path of the Rust (or tool) file
#   upstream   upstream files this module ports: its OWNED files. Exact paths, no globs.
#   secondary  optional: upstream files OWNED BY ANOTHER MODULE that this module also
#              follows (e.g. desc.cpp is owned by desc.rs and also followed by bin2onnx.py).
#              upstream-diff reports a change to these files to this module too.
#   synced     upstream commit this module was last ported or re-synced against
#   status     "planned" | "draft" (Phase A, may not compile) | "compiles" (Phase B)
#              | "partial" (the functions in `notes` are done, the rest is not ported yet)
#              | "done" (Phase C parity green)
#   phase      milestone that ports it (plan §4/§9): M1 | M2 | M3 | M8
#   notes      scope: functions skipped or partially ported, deliberate divergences
#
# [[ignored]] one per group of files that is deliberately not ported.
#   paths      exact paths or globs (`*` within a path segment, `**` across segments)
#   kind       "backend" | "external" | "replaced" (by a crate or by our own code)
#              | "not-needed" | "deferred" (feature postponed, plan §6; call sites stay
#              behind their params) | "fixture" (consumed as test data, never ported)
#   reason     one line
#
# INVARIANT (checked by `python3 -I tools/manifest_check.py`, run in CI):
#   every file under upstream/KataGo/cpp/ (recursively, every extension, nothing
#   excluded) is OWNED exactly once: either it is listed in exactly one [[module]]
#   `upstream` list, or it matches exactly one [[ignored]] entry, never both.
#   `secondary` entries must be owned by some [[module]]. Every listed path must exist and
#   every ignored glob must match at least one file. [upstream].commit must equal the
#   submodule HEAD. A new upstream file therefore fails the check until it is mapped.
#
# When you port or re-sync a module: set `status`, set `synced` to the commit you ported
# from, and record skipped functions / divergences in `notes`.

[upstream]
repo = "https://github.com/lightvector/KataGo"
tag = "v1.16.5"
commit = "ba938676d7f42d70950b3a535af2466fb642008c"

