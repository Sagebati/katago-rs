[package]
name = "katago-nn-burn"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# b18c384nbt is default so `cargo test -p katago-nn-burn` / `just nn-parity` cover a v14 net
# (optimistic policy, shortterm errors): +~25 s debug test time, +~30 s release build. Likewise the
# human-SL net b18c384nbt-humanv0 (v15, SGF metadata input).
default = ["flex", "net-b6c96", "net-b10c128", "net-b18c384nbt", "net-b18c384nbt-humanv0"]
net-b6c96 = []
net-b10c128 = []
net-b18c384nbt = []
# Human-SL net b18c384nbt-humanv0 (models/onnx/b18c384nbt-humanv0.onnx, `just convert`): model v15 with the
# SGF metadata input (+100 MB weights, +~30 s release build).
net-b18c384nbt-humanv0 = []
# CPU: `flex` is burn's portable pure-Rust backend (native and wasm).
flex = ["burn/flex", "dep:burn-flex"]
# GPU through wgpu: Vulkan/Metal natively, WebGPU in the browser, with burn's autotune (each kernel family is
# benchmarked once per process and shape).
wgpu = ["wgpu-fixed", "burn/autotune"]
# wgpu without autotune: burn's default kernel for each op, no tuning pass, plus gpu-kernels. katago-wasm uses
# this: in the browser the tuning results cannot be kept across page loads and the pass cost ~8 s per load
# (docs/M4-report.md).
wgpu-fixed = ["gpu-kernels", "burn/wgpu"]
# The cubecl kernels of wino/ (Winograd 3x3, NCHW 1x1, board reduces), for any cubecl GPU runtime (wgpu, rocm).
# Includes burn's fusion: wino/'s kernels are a burn backend extension whose Fusion routing must exist whenever
# burn's fusion is on (katago-wasm turns it on), else the call panics at runtime.
gpu-kernels = ["burn/extension", "burn/fusion", "dep:burn-cubecl", "dep:half"]
# Native AMD GPUs through HIP (ROCm), with wino.rs's kernels (the same cubecl source as on WebGPU). Not a browser path.
rocm = ["gpu-kernels", "burn/rocm"]

[dependencies]
# The ported engine (nninterface.rs trait, NNEvaluator, SymmetryHelpers); backend.rs implements its NeuralNet trait.
katago-core = { path = "../katago-core" }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
log = "0.4"
burn = { workspace = true, features = ["std"] }
burn-store.workspace = true
# burn enables flex without its SIMD kernels (macerator, gemm's wasm simd128).
burn-flex = { version = "0.22.1", default-features = false, features = ["std", "simd"], optional = true }
# GPU kernels written in cubecl (wino.rs), reached through a burn backend extension.
burn-cubecl = { version = "0.22.1", default-features = false, optional = true }
half = { version = "2", optional = true }

# wasm32: the CPU backend yields to the JS event loop between batches (host.rs, PORTING.md §11).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

# The wasm tests run under node with wasm-bindgen-test-runner 0.2.129 (as katago-core's).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"

[build-dependencies]
burn-onnx.workspace = true
# build.rs fuse_bn_act: rewriting the generated forward passes.
regex = "1"

[[example]]
name = "wino_bench"
required-features = ["wgpu-fixed"]
