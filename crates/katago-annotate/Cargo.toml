[package]
name = "katago-annotate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "katago-ws's game annotation (SGF -> KataGo analysis queries -> payload v3), IO-free and wasm-safe: shared by the browser review (katago-wasm) and, later, katago-ws and baduk_review's katago-sdk."

[features]
# Parse the engine's floats with serde_json's correctly rounded parser, as every katago-rs build with
# katago-core does (feature unification). katago-ws builds without it; the fixtures pass both ways.
float-roundtrip = ["serde_json/float_roundtrip"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SGF parser katago-ws uses (its Cargo.lock: 4.2.8).
sgf-parse = "4.2.8"
log = "0.4"

# glibc's expf on wasm32 (src/math.rs); natively the system libm, as in katago-ws.
[target.'cfg(target_arch = "wasm32")'.dependencies]
katago-core = { path = "../katago-core" }

[dev-dependencies]
# The recorded engine output of the parity fixtures is gzipped (fixtures/katago-annotate).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"
