[package]
name = "katago-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Browser host of the ported analysis engine: a wasm-bindgen Engine running katago_core::command::analysis in a Web Worker (WebGPU or wasm CPU through burn). Used by packages/katago-web."

[lib]
# cdylib for wasm-bindgen; rlib so the native unit tests (config building) link.
crate-type = ["cdylib", "rlib"]

[features]
# b6c96: the upstream analysis goldens' net (Playwright parity); b10c128: the default live-analysis net;
# b18c384nbt: the strong net (WebGPU only). The nets are selected at run time (`network` option); each adds only its
# generated model code to the wasm (b18c384nbt: +0.2 MB of 17 MB, docs/M7-report.md), its weights are fetched on demand.
default = ["net-b6c96", "net-b10c128", "net-b18c384nbt"]
net-b6c96 = ["katago-nn-burn/net-b6c96"]
net-b10c128 = ["katago-nn-burn/net-b10c128"]
# GPU-only in practice (~9x b10's compute, 105 MB of weights; the worker refuses it on the CPU unless allowed).
net-b18c384nbt = ["katago-nn-burn/net-b18c384nbt"]

[dependencies]
katago-core = { path = "../katago-core" }
sha2 = "0.10"
log = "0.4"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
wasm-bindgen = "=0.2.129"

# The engine itself is wasm32-only (natively only the config building and its tests compile).
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Both backends: WebGPU through wgpu, and burn flex (with its SIMD128 kernels) as the CPU fallback.
katago-nn-burn = { path = "../katago-nn-burn", default-features = false, features = ["flex", "wgpu-fixed-kernels"] }
burn = { workspace = true, features = ["std", "flex", "wgpu", "webgpu", "fusion"] }
# For its WGSL kernel cache (patched: third_party/cubecl-wgpu), which the worker persists across page loads.
cubecl-wgpu = { version = "=0.11.2", default-features = false }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance"] }
console_error_panic_hook = "0.1"
# rand (via burn) and Rand::init() entropy need crypto.getRandomValues on wasm32-unknown-unknown.
getrandom = { version = "0.4", features = ["wasm_js"] }

# Natively: the kernel cache's blob format (tests/kernel_cache.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cubecl-wgpu = { version = "=0.11.2", default-features = false, features = ["std"] }
