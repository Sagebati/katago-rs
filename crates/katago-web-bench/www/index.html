<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KataGo burn spike</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; --muted: #666; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; } }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; margin: 16px; }
  pre { font: 13px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
  button { font: inherit; margin-right: 8px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>KataGo b10c128 in the browser (burn)</h1>
<p class="muted" id="gpu"></p>
<p>
  <button id="all">Run all</button>
  <button data-b="webgpu">WebGPU</button>
  <button data-b="flex">CPU (wasm)</button>
</p>
<pre id="out"></pre>
<script>
// Workaround: wgpu (webgpu backend) never requests the "subgroups" feature, but
// cubecl's WGSL matmul reads the subgroup-size builtin and so always emits
// `enable subgroups;`, which Chrome rejects on a device without the feature.
// Request it whenever the adapter has it. Remove once fixed upstream.
if (globalThis.GPUAdapter) {
  const requestDevice = GPUAdapter.prototype.requestDevice;
  GPUAdapter.prototype.requestDevice = function (desc = {}) {
    const required = new Set(desc.requiredFeatures || []);
    if (this.features.has("subgroups")) required.add("subgroups");
    return requestDevice.call(this, { ...desc, requiredFeatures: [...required] });
  };
}
</script>
<script type="module">
import init, { parity, bench } from "./pkg/katago_web_bench.js";

const out = document.getElementById("out");
const log = (s) => { out.textContent += s; console.log(s); };
const f32 = async (name) => new Float32Array(await (await fetch(`assets/b10c128.${name}.f32`)).arrayBuffer());
const bytes = async (url) => new Uint8Array(await (await fetch(url)).arrayBuffer());

const t0 = performance.now();
await init();
log(`wasm init ${(performance.now() - t0).toFixed(0)} ms\n`);
document.getElementById("gpu").textContent = navigator.gpu
  ? "navigator.gpu present" : "navigator.gpu missing: WebGPU unavailable in this browser";

const bpk = await bytes("assets/g170e-b10c128.bpk");
const fx = await Promise.all(["bin_input", "global_input", "policy", "value", "scorevalue", "ownership"].map(f32));

async function run(backend) {
  try {
    log(await parity(backend, bpk.slice(), ...fx.map((a) => a.slice())));
    const batches = backend === "flex" ? [1, 8] : [1, 8, 16, 32, 64];
    log(await bench(backend, bpk.slice(), new Uint32Array(batches), backend === "flex" ? 3 : 2));
  } catch (e) {
    log(`${backend}: ERROR ${e}\n`);
  }
  window.__done = (window.__done || []).concat(backend);
}
document.querySelectorAll("button[data-b]").forEach((b) => (b.onclick = () => run(b.dataset.b)));
document.getElementById("all").onclick = async () => { await run("webgpu"); await run("flex"); };
window.__ready = true;
if (location.hash === "#auto") { await run("webgpu"); await run("flex"); }
</script>
</body>
</html>
