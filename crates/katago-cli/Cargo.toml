[package]
name = "katago-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Native drop-in `katago-rs analysis -model ... -config ...`: the ported analysis engine over stdin/stdout with the burn backend. Native only."

[[bin]]
name = "katago-rs"
path = "src/main.rs"

[features]
# CPU (burn flex) with every compile-time net. GPU: `-F wgpu` then `-backend wgpu` on the command line.
default = ["flex", "net-b6c96", "net-b10c128", "net-b18c384nbt", "net-b18c384nbt-humanv0"]
flex = ["katago-nn-burn/flex"]
wgpu = ["katago-nn-burn/wgpu"]
# Native AMD GPUs through ROCm (HIP): `-F rocm` then `-backend rocm`.
rocm = ["katago-nn-burn/rocm"]
net-b6c96 = ["katago-nn-burn/net-b6c96"]
net-b10c128 = ["katago-nn-burn/net-b10c128"]
net-b18c384nbt = ["katago-nn-burn/net-b18c384nbt"]
net-b18c384nbt-humanv0 = ["katago-nn-burn/net-b18c384nbt-humanv0"]
# The transformer nets (not default: big weights, long release builds).
net-b10c384h6nbttflrs = ["katago-nn-burn/net-b10c384h6nbttflrs"]
net-b10c512h8nbt3tflrs-fson-silu-rsnh = ["katago-nn-burn/net-b10c512h8nbt3tflrs-fson-silu-rsnh"]
net-tf3-b11c768 = ["katago-nn-burn/net-tf3-b11c768"]

[dependencies]
katago-core = { path = "../katago-core" }
katago-nn-burn = { path = "../katago-nn-burn", default-features = false }
burn = { workspace = true, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The engine's log backend (src/logger.rs): a Layer on a Registry; LogTracer bridges the `log` records of burn, cubecl, wgpu.
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
tracing-log = "0.2"
# Local-time log stamps (strftime, as DateTime::writeTimeToStream) and mkdir errno (MakeDir::make).
libc = "0.2"

[dev-dependencies]
# tests/cli_logger.rs emits the `log` records of a dependency.
log = "0.4"
serde_json = { version = "1", features = ["float_roundtrip"] }
