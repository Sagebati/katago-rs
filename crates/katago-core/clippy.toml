# PORTING.md §6 item 3: every transcendental goes through port::math (glibc-identical on all
# targets). The std methods below use the platform libm, which differs from glibc on wasm.
# port/math.rs implements them without calling these; a test comparing against the host glibc
# may `#[allow(clippy::disallowed_methods)]` with a comment saying so.
