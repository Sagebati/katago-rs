[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Sagebati/katago-rs"

[workspace.dependencies]
burn = { version = "0.22.1", default-features = false }
burn-store = "0.22"
burn-onnx = "0.22"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 1
