[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Sagebati/katago-rs"

[workspace.dependencies]
burn = { version = "0.22.1", default-features = false }
burn-store = "0.22"
burn-onnx = "0.22"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 1

# Browser builds (`just web-build`): optimized for size except burn's CPU compute kernels. Measured in M4
# (docs/M4-report.md): wasm 25.7 -> 18.2 MB raw, 5.1 -> 3.6 MB gzip, same WebGPU and wasm-CPU speed.
[profile.web]
inherits = "release"
opt-level = "s"
[profile.web.package.burn-flex]
opt-level = 3
[profile.web.package.burn-backend]
opt-level = 3
[profile.web.package.gemm]
opt-level = 3
[profile.web.package.gemm-common]
opt-level = 3
[profile.web.package.gemm-f32]
opt-level = 3
[profile.web.package.macerator]
opt-level = 3
[profile.web.package.pulp]
opt-level = 3

# burn's CPU kernels are ~50x slower unoptimized; the NN parity tests (crates/katago-nn-burn/tests)
# run them in the debug profile too. Only these third-party compute crates are optimized: the
# workspace crates (katago-core: debug assertions, overflow checks) keep the dev profile.
[profile.dev.package.burn-flex]
opt-level = 3
[profile.dev.package.burn-backend]
opt-level = 3
[profile.dev.package.burn-std]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.macerator]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3

# cubecl-wgpu 0.11.2 plus a WGSL kernel cache that katago-web persists across page loads (docs/M4-report.md,
# "Start-up on WebGPU"). The vendored copy is the crates.io package; every change is marked `PATCH(katago-rs)`:
# src/compute/wgsl_cache.rs (new), the lookup/record in WgpuServer::pipeline, two helpers made reachable.
[patch.crates-io]
cubecl-wgpu = { path = "third_party/cubecl-wgpu" }
